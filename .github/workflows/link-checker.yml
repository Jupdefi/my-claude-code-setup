name: Check Documentation Links

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    name: Check external links in documentation

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check links in markdown files
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'no'
        config-file: '.github/markdown-link-check-config.json'
        check-modified-files-only: 'no'

    - name: Create issue if links are broken
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const issueTitle = '🔗 Broken links detected in documentation';
          const issueBody = `
          ## Broken Links Detected

          The automated link checker has found broken links in the documentation.

          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Please review and fix the broken links.

          ### Common causes:
          - External site is temporarily down
          - URL has changed or moved
          - Typo in the link
          - Repository has been renamed or deleted

          ---
          *This issue was automatically created by the link-checker workflow*
          `;

          // Check if issue already exists
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'automated,documentation'
          });

          const existingIssue = issues.find(issue => issue.title === issueTitle);

          if (!existingIssue) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['automated', 'documentation', 'bug']
            });
          }
