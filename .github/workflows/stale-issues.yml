name: Manage Stale Issues and PRs

on:
  schedule:
    # Run daily at 1 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    name: Mark stale issues and PRs

    steps:
    - name: Stale issue management
      uses: actions/stale@v9
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

        # Issue settings
        stale-issue-message: |
          👋 This issue has been automatically marked as stale because it has not had recent activity.

          **It will be closed in 7 days if no further activity occurs.**

          If this issue is still relevant, please:
          - Add a comment to keep it open
          - Add new information or updates
          - Reference it in a PR

          Thank you for your contributions! 🙏

        close-issue-message: |
          🔒 This issue has been automatically closed due to inactivity.

          If you believe this issue is still relevant, please feel free to reopen it or create a new issue with updated information.

          Thank you! 🙏

        days-before-issue-stale: 60
        days-before-issue-close: 7
        stale-issue-label: 'stale'
        exempt-issue-labels: 'pinned,security,priority:high,in-progress'

        # PR settings
        stale-pr-message: |
          👋 This pull request has been automatically marked as stale because it has not had recent activity.

          **It will be closed in 14 days if no further activity occurs.**

          If this PR is still being worked on, please:
          - Push new commits
          - Add a comment with status update
          - Request a review

          Thank you for your contributions! 🙏

        close-pr-message: |
          🔒 This pull request has been automatically closed due to inactivity.

          If you'd like to continue work on this PR, please feel free to reopen it.

          Thank you! 🙏

        days-before-pr-stale: 45
        days-before-pr-close: 14
        stale-pr-label: 'stale'
        exempt-pr-labels: 'pinned,priority:high,in-progress'

        # General settings
        operations-per-run: 30
        remove-stale-when-updated: true
        exempt-all-milestones: true
